name: Build release

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Release branch to build
        required: true
        type: string
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.release_branch }}
        run: make build VERSION="$VERSION"

      - name: Archive binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            mv bin/telenotify dist/telenotify-$GOOS-$GOARCH.exe
            zip dist/telenotify-$GOOS-$GOARCH.zip dist/telenotify-$GOOS-$GOARCH.exe
          else
            mv bin/telenotify dist/telenotify-$GOOS-$GOARCH
            tar -czf dist/telenotify-$GOOS-$GOARCH.tar.gz -C dist telenotify-$GOOS-$GOARCH
          fi
          rm -f dist/telenotify-$GOOS-$GOARCH dist/telenotify-$GOOS-$GOARCH.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: telenotify-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/telenotify-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: telenotify-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ inputs.release_branch }}-${{ github.run_number }}
          RELEASE_TITLE: Telenotify ${{ inputs.release_branch }} #${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_TITLE" \
            --generate-notes
